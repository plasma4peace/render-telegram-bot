services:
  - type: web
    name: render-telegram-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bot-db
          engine: postgresql
          plan: free
      - key: RENDER_EXTERNAL_URL
        generateValue: true

databases:
  - name: bot-db
    databaseName: bot
    user: bot
    plan: free
